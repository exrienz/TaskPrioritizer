services:
  app:
    build: .
    ports:
      - "8000:80"
    depends_on:
      - mysql
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-task_prioritizer}
      - DB_USER=${DB_USER:-taskuser}
      - DB_PASS=${DB_PASS:-secure_password_123}
      - GOOGLE_OAUTH_ENABLED=${GOOGLE_OAUTH_ENABLED:-false}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-}
    volumes:
      - ./src:/var/www/html
    restart: unless-stopped
    networks:
      - task-prioritizer

  mysql:
    image: mysql:8.0
    container_name: task-prioritizer-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root_password_123}
      - MYSQL_DATABASE=${DB_NAME:-task_prioritizer}
      - MYSQL_USER=${DB_USER:-taskuser}
      - MYSQL_PASSWORD=${DB_PASS:-secure_password_123}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - task-prioritizer

networks:
  task-prioritizer:
    driver: bridge

volumes:
  mysql_data: